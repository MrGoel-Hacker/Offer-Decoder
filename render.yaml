services:
  - type: web
    name: offer-decode
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: offerdecode
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
